<!DOCTYPE html>
<html lang="en">
<head>

  <link href="style.css?v=20261025-12" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body data-page="projects">
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Project Detail Header -->
  <header class="project-detail-header">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <a href="projects.html" class="btn btn-outline-secondary mb-4">
            <i data-feather="arrow-left" style="width: 18px; height: 18px;"></i> Back to Projects
          </a>
          <div class="text-center">
            <span id="project-icon" class="bg-primary text-white p-3 rounded d-inline-block mb-3">
              <i data-feather="" style="width: 48px; height: 48px;"></i>
            </span>
            <h1 id="project-title" class="display-4 fw-bold mb-3 section-title"></h1>
            <p id="project-category" class="text-muted lead"></p>
            <div id="project-technologies" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Project Detail Content -->
  <section class="project-detail-content">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <!-- Description Section -->
          <div class="project-detail-section">
            <h2>About This Project</h2>
            <div id="project-description" class="lead"></div>
          </div>

          <!-- Actions -->
          <div class="project-actions">
            <a id="project-github-link" href="#" target="_blank" class="btn btn-primary me-2" style="display: none;">
              <i data-feather="github" style="width: 18px; height: 18px;"></i> View on GitHub
            </a>
            <a href="projects.html" class="btn btn-outline-secondary project-back-link">
              <i data-feather="arrow-left" aria-hidden="true"></i> Back to All Projects
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
